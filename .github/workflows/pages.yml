name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site (data goes under the secret path, never in the repo tree)
        env:
          DATA_PATH: ${{ secrets.DATA_PATH }}
        run: |
          mkdir -p _site
          cp -r web/. _site/
          touch _site/.nojekyll
          if [ "${#DATA_PATH}" -ge 32 ] && [ -d data ]; then
            mkdir -p "_site/d/$DATA_PATH"
            cp -r data/. "_site/d/$DATA_PATH/"
          else
            echo "DATA_PATH secret missing: publishing the app shell only"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
